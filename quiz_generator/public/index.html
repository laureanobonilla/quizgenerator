<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Cuestionarios IA</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-6">

  <div class="max-w-xl w-full bg-slate-800 p-8 rounded-2xl shadow-xl border border-slate-700">
    <h1 class="text-2xl font-bold mb-2 text-center bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">Generador Inteligente de Quizzes</h1>
    <p class="text-slate-400 text-sm text-center mb-6">Sube tu PDF y selecciona el nivel deseado para generar preguntas de alta calidad al instante.</p>

    <div id="upload-section" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1 text-slate-300">Tu Nombre o Identificador</label>
        <input type="text" id="username" placeholder="Ej: Laureano" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
      </div>

      <div>
        <label class="block text-sm font-medium mb-1 text-slate-300">Nivel del Cuestionario</label>
        <select id="quizLevel" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
          <option value="principiante">Principiante (25 preguntas)</option>
          <option value="intermedio">Intermedio (25 preguntas)</option>
          <option value="avanzado">Avanzado (25 preguntas)</option>
          <option value="experto">Experto (25 preguntas)</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium mb-1 text-slate-300">Archivo PDF de estudio</label>
        <input type="file" id="pdfFile" accept="application/pdf" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 cursor-pointer">
      </div>

      <button onclick="generateQuiz()" id="btnSubmit" class="w-full mt-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-lg transition duration-200 shadow-lg shadow-indigo-600/30">
        Generar Cuestionario con IA
      </button>
    </div>

    <div id="loading-section" class="hidden text-center py-10 space-y-4">
      <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-indigo-500 border-t-transparent"></div>
      <p id="loading-text" class="text-indigo-300 font-medium animate-pulse">Leyendo el PDF en tu navegador...</p>
    </div>

    <div id="success-section" class="hidden text-center py-8 space-y-4">
      <div class="text-green-400 text-5xl">✓</div>
      <h2 class="text-xl font-bold text-white">¡Cuestionario creado con éxito!</h2>
      <p class="text-sm text-slate-300">Guardado de manera segura en JSONBin.io.</p>
      <div class="bg-slate-900 p-3 rounded-lg border border-slate-700 text-xs font-mono text-indigo-400 break-all" id="binIdDisplay"></div>
      <button onclick="location.reload()" class="bg-slate-700 hover:bg-slate-600 text-white text-sm px-6 py-2 rounded-lg">Generar otro quiz</button>
    </div>
  </div>

  <script>
    async function extractTextFromPDF(file) {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let fullText = '';

      for (let i = 1; i <= pdf.numPages; i++) {
        document.getElementById('loading-text').innerText = `Extrayendo texto: Página ${i} de ${pdf.numPages}...`;
        const page = await pdf.getPage(i);
        const textContent = await page.getTextContent();
        const pageText = textContent.items.map(item => item.str).join(' ');
        fullText += pageText + '\n';
      }
      return fullText;
    }

    async function generateQuiz() {
      const username = document.getElementById('username').value.trim() || 'Usuario';
      const level = document.getElementById('quizLevel').value;
      const fileInput = document.getElementById('pdfFile');
      
      if (fileInput.files.length === 0) {
        alert('Por favor selecciona un archivo PDF.');
        return;
      }

      const file = fileInput.files[0];
      
      document.getElementById('upload-section').classList.add('hidden');
      document.getElementById('loading-section').classList.remove('hidden');

      try {
        const pdfText = await extractTextFromPDF(file);

        document.getElementById('loading-text').innerText = 'Enviando texto a la IA (esto toma unos segundos)...';

        const response = await fetch('/.netlify/functions/generate-quiz', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            pdfText: pdfText,
            userIdentifier: username,
            selectedLevel: level
          })
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || 'Error desconocido en el servidor');
        }

        document.getElementById('loading-section').classList.add('hidden');
        document.getElementById('success-section').classList.remove('hidden');
        document.getElementById('binIdDisplay').innerText = 'Bin ID en JSONBin: ' + result.binId;

      } catch (err) {
        alert('Error: ' + err.message);
        document.getElementById('loading-section').classList.add('hidden');
        document.getElementById('upload-section').classList.remove('hidden');
      }
    }
  </script>

</body>
</html>
